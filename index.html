<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الـ 100 ريال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; touch-action: manipulation; }
        .tower-container { display: flex; justify-content: space-around; align-items: flex-end; height: 300px; margin-top: 50px; padding-bottom: 20px; }
        .tower { width: 30%; height: 100%; position: relative; border-bottom: 8px solid #334155; display: flex; flex-direction: column-reverse; align-items: center; }
        .rod { width: 10px; height: 200px; background: #475569; position: absolute; bottom: 0; z-index: -1; border-radius: 5px; }
        .disk { height: 35px; background: linear-gradient(90deg, #3b82f6, #06b6d4); border-radius: 10px; margin-bottom: 2px; width: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; touch-action: none; }
        
        #prank-overlay, #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; display: flex; }
        #start-overlay { background: #0f172a; }
        #prank-overlay { display: none; background: #be123c; }
        
        input, select { padding: 12px; border-radius: 8px; border: none; width: 80%; max-width: 300px; margin-bottom: 15px; font-size: 16px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; background: #fbbf24; color: #000; }
        #prank-overlay button { background: white; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: #fbbf24;">مستعد للتحدي؟ 🤑</h1>
        <p>اكتب اسمك وحدد (ولد/بنت) عشان الجائزة</p>
        <input type="text" id="user-name" placeholder="اكتب اسمك هنا..." autocomplete="off">
        <select id="user-gender">
            <option value="male">ولد</option>
            <option value="female">بنت</option>
        </select>
        <button onclick="startGame()">أنا مستعد، ابدأ!</button>
    </div>

    <h1 style="color: #fbbf24;">اتحداك تفوز ولك 100 ريال🤑</h1>
    <h2 id="move-count">التحركات: 0 / 31</h2>

    <div class="tower-container">
        <div class="tower" id="tower-0"><div class="rod"></div><div class="disk" style="width: 90%" data-size="5">5</div><div class="disk" style="width: 80%" data-size="4">4</div><div class="disk" style="width: 70%" data-size="3">3</div><div class="disk" style="width: 60%" data-size="2">2</div><div class="disk" style="width: 50%" data-size="1">1</div></div>
        <div class="tower" id="tower-1"><div class="rod"></div></div>
        <div class="tower" id="tower-2"><div class="rod"></div></div>
    </div>

    <div id="prank-overlay">
        <h1 style="font-size: 80px;">😂😂</h1>
        <h1 id="prank-title">يا [الاسم] أتحداك تفوز!</h1>
        <p id="prank-msg">الـ 100 ريال بعيدة عنك..</p>
        <button onclick="location.reload()">محاولة ثانية</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <script>
        let moves = 0;
        let playerName = "";
        let playerGender = "male";

        function startGame() {
            const nameInput = document.getElementById('user-name');
            if (nameInput.value.trim() === "") {
                alert("يا بطل، لازم تكتب اسمك أول!");
                return;
            }
            playerName = nameInput.value;
            playerGender = document.getElementById('user-gender').value;
            document.getElementById('start-overlay').style.display = 'none';
        }

        const drake = dragula([document.getElementById('tower-0'), document.getElementById('tower-1'), document.getElementById('tower-2')], {
            invalid: (el, handle) => el.previousElementSibling.classList.contains('disk')
        });

        drake.on('drop', (el, target, source) => {
            if (target === source) return;
            const topDisk = target.querySelector('.disk:nth-child(n+2)');
            if (topDisk && parseInt(el.dataset.size) > parseInt(topDisk.dataset.size)) {
                source.appendChild(el);
            } else {
                moves++;
                document.getElementById('move-count').innerText = "التحركات: " + moves + " / 31";
                if (moves >= 30) {
                    setTimeout(() => {
                        document.getElementById('prank-title').innerText = `يا ${playerName} أتحداك تفوز!`;
                        if (playerGender === "female") {
                            document.getElementById('prank-msg').innerText = "😱 الـ 100 ريال بعيدة عن خيالك.. جربي مرة ثانية!";
                        } else {
                            document.getElementById('prank-msg').innerText = "😱 الـ 100 ريال بعيدة عن شاربك.. جرب مرة ثانية!";
                        }
                        document.getElementById('prank-overlay').style.display = 'flex';
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
