<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 100 ريال</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; }
        .tower-container { display: flex; justify-content: center; align-items: flex-end; height: 300px; margin-top: 50px; }
        .tower { width: 120px; height: 100%; position: relative; border-bottom: 8px solid #334155; margin: 0 20px; }
        .rod { width: 10px; height: 200px; background: #475569; position: absolute; bottom: 0; left: 55px; border-radius: 5px; }
        .disk { height: 35px; background: linear-gradient(90deg, #3b82f6, #06b6d4); border-radius: 10px; position: absolute; cursor: grab; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #prank-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #be123c; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <h1 style="color: #fbbf24;">💸 تحدي الـ 100 ريال 💸</h1>
    <p>حلها في 31 حركة بالضبط وخذ جائزتك!</p>
    <h2 id="move-count">التحركات: 0 / 31</h2>

    <div class="tower-container">
        <div class="tower" id="tower-0" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="rod"></div></div>
        <div class="tower" id="tower-1" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="rod"></div></div>
        <div class="tower" id="tower-2" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="rod"></div></div>
    </div>

    <div id="prank-overlay">
        <h1 style="font-size: 100px;">😂😂</h1>
        <h1 style="font-size: 40px;">أتحداك تفوز!</h1>
        <p style="font-size: 20px;">😂الـ 100 ريال بعيدة عن شاربك.. جرب مرة ثانية !</p>
        <button onclick="location.reload()" style="padding: 15px 40px; font-size: 20px; background: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">حاول مرة ثانية (لو فيك خير)</button>
    </div>

    <script>
        let moves = 0;
        let towers = [[5, 4, 3, 2, 1], [], []];

        function render() {
            document.querySelectorAll('.disk').forEach(d => d.remove());
            towers.forEach((tower, tIdx) => {
                tower.forEach((size, dIdx) => {
                    let disk = document.createElement('div');
                    disk.className = 'disk';
                    disk.draggable = (dIdx === tower.length - 1);
                    disk.style.width = (size * 25 + 30) + 'px';
                    disk.style.bottom = (dIdx * 38) + 'px';
                    disk.style.left = (60 - (size * 25 + 30) / 2) + 'px';
                    disk.innerText = size;
                    disk.id = `disk-${size}`;
                    disk.ondragstart = (e) => { e.dataTransfer.setData("text", tIdx); };
                    document.getElementById(`tower-${tIdx}`).appendChild(disk);
                });
            });
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function drop(ev) {
            ev.preventDefault();
            let fromTowerIdx = ev.dataTransfer.getData("text");
            let toTowerId = ev.target.closest('.tower').id;
            let toTowerIdx = parseInt(toTowerId.split('-')[1]);
            
            let disk = towers[fromTowerIdx][towers[fromTowerIdx].length - 1];
            let topDiskTarget = towers[toTowerIdx][towers[toTowerIdx].length - 1];

            if (!topDiskTarget || disk < topDiskTarget) {
                towers[fromTowerIdx].pop();
                towers[toTowerIdx].push(disk);
                moves++;
                document.getElementById('move-count').innerText = "التحركات: " + moves + " / 31";
                
                if (moves >= 30) {
                    setTimeout(() => {
                        document.getElementById('prank-overlay').style.display = 'flex';
                    }, 400);
                }
            }
            render();
        }
        render();
    </script>
</body>
</html>
