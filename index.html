<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الـ 100 ريال 🤑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .header { padding: 15px; background: #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #pool { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 120px; background: #1e293b; margin: 15px; border-radius: 20px; border: 2px dashed #334155; padding: 15px; transition: 0.3s; }
        
        .stage { display: flex; justify-content: space-around; align-items: flex-end; height: 280px; margin-top: 10px; padding: 0 10px; }
        
        .column { width: 28%; height: 100%; border-bottom: 6px solid #475569; display: flex; flex-direction: column-reverse; align-items: center; background: rgba(255,255,255,0.03); border-radius: 15px 15px 0 0; transition: all 0.3s ease; position: relative; }
        
        /* تأثير توضيح الأعمدة عند التفاعل */
        .column.highlight { background: rgba(251, 191, 36, 0.2); border-bottom-color: #fbbf24; box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.2); }

        .disk { height: 45px; margin: 3px 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; cursor: pointer; color: white; transition: box-shadow 0.2s; touch-action: none; }
        .d1 { width: 60px; background: linear-gradient(45deg, #ef4444, #b91c1c); }
        .d2 { width: 80px; background: linear-gradient(45deg, #f97316, #c2410c); }
        .d3 { width: 100px; background: linear-gradient(45deg, #eab308, #a16207); }
        .d4 { width: 120px; background: linear-gradient(45deg, #22c55e, #15803d); }
        .d5 { width: 140px; background: linear-gradient(45deg, #3b82f6, #1d4ed8); }

        /* تأثير التوهج والتحديد */
        .gu-transit { opacity: 0.5; transform: scale(1.05); box-shadow: 0 0 25px #fbbf24 !important; }
        .gu-mirror { cursor: grabbing; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid #fbbf24; transform: scale(1.1); }

        #start-overlay, #prank-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f172a; padding: 20px; }
        #prank-overlay { display: none; background: #be123c; }
        
        input, select, button { padding: 18px; border-radius: 12px; border: none; margin: 10px; font-size: 18px; width: 85%; max-width: 320px; text-align: center; font-weight: bold; }
        button { background: #fbbf24; color: black; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: #fbbf24;">مستعد للتحدي؟ 🤑</h1>
        <p>اكتب اسمك وحدد (ولد/بنت) عشان الجائزة</p>
        <input type="text" id="user-name" placeholder="اكتب اسمك هنا..." autocomplete="off">
        <select id="user-gender">
            <option value="male">ولد</option>
            <option value="female">بنت</option>
        </select>
        <button onclick="startGame()">أنا مستعد، ابدأ! ✅</button>
    </div>

    <div class="header">
        <h1 style="color: #fbbf24; font-size: 22px; margin: 0;">اتحداك تفوز ولك 100 ريال🤑</h1>
        <h2 id="move-count" style="margin: 5px 0; font-size: 18px;">التحركات: 0 / 15</h2>
    </div>

    <div id="pool"></div>

    <div class="stage">
        <div class="column" id="c1"></div>
        <div class="column" id="c2"></div>
        <div class="column" id="c3"></div>
    </div>

    <div id="prank-overlay">
        <h1 style="font-size: 80px;">😂😂</h1>
        <h1 id="prank-title">يا [الاسم] أتحداك تفوز!</h1>
        <p id="prank-msg">😱 الـ 100 ريال بعيدة عنك..</p>
        <button onclick="location.reload()" style="background: white;">محاولة ثانية 🔄</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <script>
        let moves = 0;
        let playerName = "";
        let playerGender = "male";

        function startGame() {
            const input = document.getElementById('user-name');
            if (input.value.trim() === "") {
                alert("يا بطل، لازم تكتب اسمك أول!");
                return;
            }
            playerName = input.value;
            playerGender = document.getElementById('user-gender').value;
            
            const pool = document.getElementById('pool');
            const disks = [
                '<div class="disk d1" data-v="1">1</div>',
                '<div class="disk d2" data-v="2">2</div>',
                '<div class="disk d3" data-v="3">3</div>',
                '<div class="disk d4" data-v="4">4</div>',
                '<div class="disk d5" data-v="5">5</div>'
            ].sort(() => Math.random() - 0.5);
            pool.innerHTML = disks.join('');
            
            document.getElementById('start-overlay').style.display = 'none';
        }

        const drake = dragula([
            document.getElementById('pool'),
            document.getElementById('c1'),
            document.getElementById('c2'),
            document.getElementById('c3')
        ]);

        drake.on('drag', () => {
            document.querySelectorAll('.column').forEach(col => col.classList.add('highlight'));
        });

        drake.on('dragend', () => {
            document.querySelectorAll('.column').forEach(col => col.classList.remove('highlight'));
        });

        drake.on('drop', () => {
            moves++;
            document.getElementById('move-count').innerText = "التحركات: " + moves + " / 15";
            
            if (moves >= 15) {
                setTimeout(() => {
                    document.getElementById('prank-title').innerText = `يا ${playerName} أتحداك تفوز!`;
                    if (playerGender === "female") {
                        document.getElementById('prank-msg').innerText = "😱 الـ 100 ريال بعيدة عن خيالك.. جربي مرة ثانية!";
                    } else {
                        document.getElementById('prank-msg').innerText = "😱 الـ 100 ريال بعيدة عن شاربك.. جرب مرة ثانية!";
                    }
                    document.getElementById('prank-overlay').style.display = 'flex';
                }, 400);
            }
        });
    </script>
</body>
</html>
