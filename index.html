<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الـ 100 ريال 🤑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .header { padding: 10px; background: #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
        
        /* صورة الهدف المطلوبة */
        .target-preview { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); padding: 5px; border-radius: 8px; border: 1px solid #fbbf24; }
        .target-preview div { height: 10px; margin: 2px auto; border-radius: 2px; }
        
        .goal-msg { color: #fbbf24; font-weight: bold; font-size: 14px; margin: 5px 0; }
        .stage { display: flex; justify-content: space-around; align-items: flex-end; height: 320px; margin-top: 20px; padding: 0 10px; }
        .column { width: 30%; height: 100%; border-bottom: 8px solid #475569; display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.03); border-radius: 15px 15px 0 0; padding-top: 20px; }
        #c3 { border-bottom-color: #fbbf24; background: rgba(251, 191, 36, 0.05); }

        .disk { height: 40px; margin: 4px 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; cursor: pointer; color: white; transition: 0.2s; width: 80%; }
        .d1 { background: #ef4444; width: 40%; } .d2 { background: #f97316; width: 55%; }
        .d3 { background: #eab308; width: 70%; } .d4 { background: #22c55e; width: 85%; }
        .d5 { background: #3b82f6; width: 95%; }

        #prank-overlay { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; background: #be123c; padding: 20px; }
        button { padding: 15px 30px; border-radius: 12px; border: none; background: #fbbf24; color: black; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="target-preview">
            <span style="font-size: 10px; display: block; margin-bottom: 3px;">الهدف 👇</span>
            <div class="d1" style="height: 6px;"></div><div class="d2" style="height: 6px;"></div>
            <div class="d3" style="height: 6px;"></div><div class="d4" style="height: 6px;"></div>
            <div class="d5" style="height: 6px;"></div>
        </div>
        <h1 style="color: #fbbf24; font-size: 18px; margin: 0;">تحدي الذكاء: فوز بـ 100 ريال 🤑</h1>
        <div class="goal-msg">رتبهم من 1 (فوق) إلى 5 (تحت) في العمود الأصفر</div>
        <h2 id="move-count" style="font-size: 16px;">التحركات المتبقية: 10</h2>
    </div>

    <div class="stage">
        <div class="column" id="c1"></div>
        <div class="column" id="c2"></div>
        <div class="column" id="c3"></div>
    </div>

    <div id="prank-overlay">
        <h1 style="font-size: 60px;">❌ خسرت!</h1>
        <h2 id="p-msg">للأسف يا بطل.. الحركات خلصت عليك!</h2>
        <p style="font-size: 18px;">الـ 100 ريال طارت، حاول تركز أكثر المرة الجاية 😂🔥</p>
        <button onclick="location.reload()">أبي أحاول مرة ثانية 🔄</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <script>
        let moves = 10;
        const disksHtml = [
            '<div class="disk d1" data-v="1">1</div>',
            '<div class="disk d2" data-v="2">2</div>',
            '<div class="disk d3" data-v="3">3</div>',
            '<div class="disk d4" data-v="4">4</div>',
            '<div class="disk d5" data-v="5">5</div>'
        ];

        // توزيع عشوائي صعب في البداية
        const cols = [document.getElementById('c1'), document.getElementById('c2'), document.getElementById('c3')];
        disksHtml.sort(() => Math.random() - 0.5).forEach(d => {
            cols[Math.floor(Math.random() * 2)].innerHTML += d;
        });

        const drake = dragula(cols);

        drake.on('drop', (el, target) => {
            moves--;
            document.getElementById('move-count').innerText = "التحركات المتبقية: " + moves;

            // لحظة الغدر: إذا وصل للعمود الأصفر وباقي له حركات قليلة
            if (target.id === 'c3' && target.children.length >= 4) {
                setTimeout(() => {
                    // تبديل الأماكن بشكل عشوائي ومفاجئ
                    const allDisks = Array.from(document.querySelectorAll('.disk'));
                    allDisks.forEach(d => {
                        cols[Math.floor(Math.random() * 3)].appendChild(d);
                    });
                    el.style.transform = "scale(1.5) rotate(10deg)";
                }, 200);
            }

            if (moves <= 0) {
                setTimeout(() => {
                    document.getElementById('prank-overlay').style.display = 'flex';
                }, 500);
            }
        });
    </script>
</body>
</html>
